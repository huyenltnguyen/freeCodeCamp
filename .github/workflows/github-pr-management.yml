name: GitHub - PR Management

env:
  DEPRIORITIZED_CLOSE_HOURS: "72"
  STALE_DRAFT_DAYS: "60"
  WAITING_UPDATE_REMINDER_DAYS: "7"
  WAITING_UPDATE_CLOSE_DAYS: "14"

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours — deprioritized autoclose, merge conflict
    - cron: "0 9 * * *" # daily at 09:00 UTC — stale drafts, waiting update

jobs:
  # Closes PRs labeled 'deprioritized' if the author has been inactive since the label
  # was applied, giving contributors a grace period to respond before the PR is shut.
  deprioritized-autoclose:
    name: Auto-Close Inactive Deprioritized PRs
    runs-on: ubuntu-24.04
    if: github.event.schedule == '0 */6 * * *'
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const closeHours = parseInt(process.env.DEPRIORITIZED_CLOSE_HOURS, 10);
            const closeMs = closeHours * 60 * 60 * 1000;
            const closingBody = [
              'Hey there,',
              '',
              'Thank you for opening this pull request.',
              '',
              "This is a standard message notifying you that we've reviewed your pull request and have decided not to merge it. We would welcome future pull requests from you.",
              '',
              'Thank you and happy coding.'
            ].join('\n');

            const prs = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deprioritized',
              per_page: 100
            });

            const now = new Date();

            for (const pr of prs) {
              if (!pr.pull_request) continue;

              // Find when 'deprioritized' label was most recently added
              const timeline = await github.paginate(
                github.rest.issues.listEventsForTimeline,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  per_page: 100
                }
              );

              const labelEvents = timeline
                .filter(e => e.event === 'labeled' && e.label?.name === 'deprioritized')
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              if (labelEvents.length === 0) continue;

              const labeledAt = new Date(labelEvents[0].created_at);
              if (now - labeledAt < closeMs) continue;

              // Check for author activity (commits or comments by PR author) after label was added
              const author = pr.user.login;
              const [commits, comments] = await Promise.all([
                github.paginate(github.rest.pulls.listCommits, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  per_page: 100
                }),
                github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  per_page: 100
                })
              ]);

              const hasAuthorActivity =
                commits.some(c => new Date(c.commit.committer.date) > labeledAt) ||
                comments.some(c => c.user?.login === author && new Date(c.created_at) > labeledAt);

              if (hasAuthorActivity) continue;

              // Verify PR is still open before acting
              const { data: prData } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });
              if (prData.state !== 'open') continue;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: closingBody
              });
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed'
              });
            }

  # Scans all open PRs and applies the 'MERGE CONFLICT!' label to any that has merge conflicts
  # and removes the label once the conflict is resolved.
  merge-conflict-label:
    name: Label PRs with Merge Conflicts
    runs-on: ubuntu-24.04
    if: github.event.schedule == '0 */6 * * *'
    steps:
      - uses: eps1lon/actions-label-merge-conflict@v3.0.3
        with:
          dirtyLabel: "MERGE CONFLICT!"
          repoToken: ${{ secrets.GITHUB_TOKEN }}

  # Closes draft PRs that have had no activity from the author for an extended period
  stale-draft-close:
    name: Close Stale Draft PRs
    runs-on: ubuntu-24.04
    if: github.event.schedule == '0 9 * * *'
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const staleDays = parseInt(process.env.STALE_DRAFT_DAYS, 10);
            const staleMs = staleDays * 24 * 60 * 60 * 1000;
            const closingBody = [
              'Hey there,',
              '',
              'Thank you for opening this pull request.',
              '',
              "This is a standard message notifying you that we've reviewed your pull request and have decided not to merge it. We would welcome future pull requests from you.",
              '',
              'Thank you and happy coding.'
            ].join('\n');

            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const now = new Date();

            for (const pr of prs) {
              if (!pr.draft) continue;

              const author = pr.user.login;
              const cutoff = new Date(now - staleMs);

              const [commits, comments] = await Promise.all([
                github.paginate(github.rest.pulls.listCommits, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  per_page: 100
                }),
                github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  per_page: 100
                })
              ]);

              const hasRecentActivity =
                commits.some(c => new Date(c.commit.committer.date) > cutoff) ||
                comments.some(c => c.user?.login === author && new Date(c.created_at) > cutoff);

              if (hasRecentActivity) continue;

              // Verify PR is still open before acting
              const { data: prData } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });
              if (prData.state !== 'open') continue;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: closingBody
              });
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed'
              });
            }

  # Sends a reminder to the PR author when a 'status: waiting update' PR goes quiet,
  # then closes it if there is still no response after the close deadline.
  waiting-update-reminder:
    name: Remind and Close PRs Waiting for Update
    runs-on: ubuntu-24.04
    if: github.event.schedule == '0 9 * * *'
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reminderDays = parseInt(process.env.WAITING_UPDATE_REMINDER_DAYS, 10);
            const closeDays = parseInt(process.env.WAITING_UPDATE_CLOSE_DAYS, 10);
            const reminderMs = reminderDays * 24 * 60 * 60 * 1000;
            const closeMs = closeDays * 24 * 60 * 60 * 1000;
            const sevenDaysMs = 7 * 24 * 60 * 60 * 1000;
            const footer = '\n\n---\n_This message was automatically generated. Need help? Join us [in our contributor chat](https://discord.gg/PRyKn3Vbay)._';
            const closingBody = [
              'Hey there,',
              '',
              'Thank you for opening this pull request.',
              '',
              "This is a standard message notifying you that we've reviewed your pull request and have decided not to merge it. We would welcome future pull requests from you.",
              '',
              'Thank you and happy coding.'
            ].join('\n');

            const prs = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'status: waiting update',
              per_page: 100
            });

            const now = new Date();

            for (const pr of prs) {
              if (!pr.pull_request) continue;

              const author = pr.user.login;

              // Find when 'status: waiting update' label was most recently added
              const timeline = await github.paginate(
                github.rest.issues.listEventsForTimeline,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  per_page: 100
                }
              );

              const labelEvents = timeline
                .filter(e => e.event === 'labeled' && e.label?.name === 'status: waiting update')
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              if (labelEvents.length === 0) continue;

              const labeledAt = new Date(labelEvents[0].created_at);
              const elapsed = now - labeledAt;

              // Check for author activity (commits or comments) after label was added
              const [commits, comments] = await Promise.all([
                github.paginate(github.rest.pulls.listCommits, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  per_page: 100
                }),
                github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  per_page: 100
                })
              ]);

              const hasAuthorActivity =
                commits.some(c => new Date(c.commit.committer.date) > labeledAt) ||
                comments.some(c => c.user?.login === author && new Date(c.created_at) > labeledAt);

              if (hasAuthorActivity) continue;

              if (elapsed >= closeMs) {
                // Verify PR is still open before acting
                const { data: prData } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number
                });
                if (prData.state !== 'open') continue;

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: closingBody
                });
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  state: 'closed'
                });
              } else if (elapsed >= reminderMs) {
                // Skip if a bot reminder was already posted in the last 7 days
                const recentBotReminder = comments.some(
                  c =>
                    c.user?.login === 'github-actions[bot]' &&
                    c.body.includes("it's been a while since we last heard from you") &&
                    new Date(c.created_at) > new Date(now - sevenDaysMs)
                );
                if (recentBotReminder) continue;

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: [
                    `Hey @${author} — it's been a while since we last heard from you on this PR. Are you still working on it?`,
                    '',
                    "If you're blocked or need help, feel free to let us know in the comments. If we don't hear back in the next week, this PR will be automatically closed to keep the queue tidy."
                  ].join('\n') + footer
                });
              }
            }
